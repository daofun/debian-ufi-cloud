name: Build Debian for MSM8916 随身WiFi

# ============================================================================
# 用法：
#   1. Fork Mio-sha512/OpenStick-Builder（切到 debian 分支）
#   2. 把本文件覆盖到  .github/workflows/build.yml
#   3. Actions → Build Debian for MSM8916 随身WiFi → Run workflow
#   4. 选板型、填包名 → 开跑（约 20-40 分钟）→ 下载 artifact
#
# 说明：本 workflow 只是在原仓库构建流程外面包了一层「可视化参数注入」，
#       真正的构建逻辑仍是 scripts/ 下的六个脚本，用的是 postmarketOS
#       为 MSM8916 预编译的内核（不需要自己编译内核，所以很快）。
# ============================================================================

on:
  workflow_dispatch:
    inputs:

      device:
        description: '设备板型（决定用哪个 DTB）'
        required: true
        default: 'thwc-ufi001c'
        type: choice
        options:
          - thwc-ufi001c      # UFI001B / UFI001C / UFI003 / ufi103s / w001 / sp970 兜底
          - yiming-uz801v3    # UZ801 v3（默认最稳的型号）
          - thwc-uf896        # UF896
          - jz01-45-v33       # JZ01-45 / JZ02V10
          - fy-mf800          # MF800 / MF800B-E

      suite:
        description: 'Debian 版本'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm          # Debian 12，推荐
          - bullseye          # Debian 11，最省内存
          - trixie            # Debian 13，较新

      extra_packages:
        description: '额外预装软件包（空格分隔的 Debian 包名，不要写 OpenWrt 的 ipk 名！）'
        required: false
        default: 'htop vim curl wget git nano net-tools'
        type: string

      hostname:
        description: '主机名'
        required: false
        default: 'openstick'
        type: string

      ssh_public_key:
        description: '（可选）SSH 公钥，填了就能免密登录'
        required: false
        default: ''
        type: string

      upload_release:
        description: '构建完成后发布到 Releases（而不是只存 artifact）'
        required: false
        default: false
        type: boolean

      release_tag:
        description: 'Release 标签（仅当上面勾选时有效）'
        required: false
        default: ''
        type: string

# ----------------------------------------------------------------------------
permissions:
  contents: write

env:
  DEVICE_BOARD: ${{ inputs.device }}
  DEBIAN_SUITE: ${{ inputs.suite }}
  EXTRA_PKGS:   ${{ inputs.extra_packages }}
  HOSTNAME:     ${{ inputs.hostname }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------------
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: true      # lk2nd / qtestsign / qhypstub / gt / libusbgx

      # ---------------------------------------------------------------
      - name: 注入设备板型（DTB）
        run: |
          set -e
          echo "目标板型: ${{ inputs.device }}"
          if [ -f configs/extlinux.conf ]; then
            sed -i "s#msm8916-[a-z0-9_-]*\.dtb#msm8916-${{ inputs.device }}.dtb#g" configs/extlinux.conf
            echo "--- configs/extlinux.conf ---"
            cat configs/extlinux.conf
          else
            echo "::warning::未找到 configs/extlinux.conf，请手动确认 DTB 配置"
          fi

      # ---------------------------------------------------------------
      - name: 注入 Debian 版本
        run: |
          set -e
          if grep -RqsE '\b(bookworm|bullseye|trixie|stable|testing)\b' scripts/debootstrap.sh; then
            sed -i "s/\b\(bookworm\|bullseye\|trixie\)\b/${{ inputs.suite }}/g" scripts/debootstrap.sh
            echo "已注入 Debian 版本: ${{ inputs.suite }}"
          else
            echo "::warning::scripts/debootstrap.sh 中未找到发行版代号，请手动修改"
          fi

      # ---------------------------------------------------------------
      - name: 注入额外软件包
        run: |
          set -e
          PKGS="${{ inputs.extra_packages }}"
          if [ -z "$PKGS" ]; then
            echo "未指定额外软件包，跳过"
            exit 0
          fi
          if grep -qsE '^[[:space:]]*apt(-get)?[[:space:]]+install' scripts/setup.sh; then
            # 在 setup.sh 里第一条 apt install 行末尾追加包名
            sed -i "0,/^\([[:space:]]*apt\(-get\)\?[[:space:]]\+install.*\)$/s//\1 $PKGS/" scripts/setup.sh
            echo "已注入软件包: $PKGS"
            grep -nE '^[[:space:]]*apt(-get)?[[:space:]]+install' scripts/setup.sh | head -5
          else
            echo "::warning::scripts/setup.sh 中未找到 apt install 行，" \
                 "请手动把 [$PKGS] 加进包列表" >> $GITHUB_STEP_SUMMARY
          fi

      # ---------------------------------------------------------------
      - name: 注入主机名与 SSH 公钥
        run: |
          set -e
          if [ -n "${{ inputs.hostname }}" ]; then
            grep -Rqsl 'openstick' scripts/ 2>/dev/null && \
              sed -i "s/\bopenstick\b/${{ inputs.hostname }}/g" scripts/setup.sh 2>/dev/null || true
          fi
          if [ -n "${{ inputs.ssh_public_key }}" ]; then
            mkdir -p configs/inject
            echo "${{ inputs.ssh_public_key }}" > configs/inject/authorized_keys
            echo "SSH 公钥已写入 configs/inject/authorized_keys"
            echo "::warning::SSH 公钥需 debootstrap.sh 里存在拷贝逻辑才会生效，" \
                 "若无则刷机后手动写入 ~/.ssh/authorized_keys" >> $GITHUB_STEP_SUMMARY
          fi

      # ======================= 以下为原仓库构建流程 =======================

      - name: 安装依赖
        run: sudo sh -e scripts/install_deps.sh

      - name: 构建 hyp 与 lk2nd 引导
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: 提取高通固件与分区表
        run: sudo sh -e scripts/extract_fw.sh

      - name: 构建 Debian rootfs（debootstrap）
        run: sudo sh -e scripts/debootstrap.sh

      - name: 构建 USB gadget-tools
        run: sudo sh -e scripts/build_gt.sh

      - name: 生成最终镜像
        run: sudo sh -e scripts/build_images.sh

      # =================================================================

      - name: 整理产物
        id: pack
        run: |
          set -e
          mkdir -p dist
          cp -a files/* dist/ 2>/dev/null || true
          cp -a flash/* dist/ 2>/dev/null || true
          ls -lh dist/
          echo "tag=${{ inputs.release_tag || format('debian-{0}-{1}', inputs.device, github.run_number) }}" >> $GITHUB_OUTPUT

      - name: 打包成一键刷机 zip
        run: |
          set -e
          cd dist
          zip -r ../msm8916-debian-${{ inputs.device }}.zip . || \
            (sudo apt-get install -y zip && zip -r ../msm8916-debian-${{ inputs.device }}.zip .)
          cd ..
          ls -lh *.zip

      - name: 输出刷机说明
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 构建完成

          | 项目 | 值 |
          |---|---|
          | 板型 DTB | \`msm8916-${{ inputs.device }}.dtb\` |
          | Debian | ${{ inputs.suite }} |
          | 额外软件 | \`${{ inputs.extra_packages }}\` |

          ### 刷机命令

          \`\`\`bash
          # 1) EDL 模式备份原始分区（必做！）
          for n in fsc fsg modem modemst1 modemst2 persist sec; do edl r \$n \$n.bin; done

          # 2) EDL 刷入自建 aboot，重启进 fastboot
          edl w aboot aboot.mbn
          edl e boot
          edl reset

          # 3) fastboot 刷入（注意 partition 必须第一个刷）
          fastboot flash partition gpt_both0.bin
          fastboot flash aboot aboot.mbn
          fastboot flash hyp   hyp.mbn
          fastboot flash rpm   rpm.mbn
          fastboot flash sbl1  sbl1.mbn
          fastboot flash tz    tz.mbn
          fastboot flash boot   boot.bin
          fastboot flash rootfs rootfs.bin

          # 4) 恢复基带校准分区（否则 4G 失效）
          for n in fsc fsg modem modemst1 modemst2 persist sec; do fastboot flash \$n \$n.bin; done

          fastboot reboot
          \`\`\`

          ### 首次登录

          - 用户名 \`user\` / 密码 \`1\`（进去立刻 \`passwd\` 改掉）
          - USB RNDIS：\`ssh user@192.168.5.1\`
          - 自带热点：SSID \`Openstick\` 密码 \`openstick\`，网关 192.168.4.1
          - 若启动异常，进系统后改 DTB：
            \`sed -i 's/msm8916-${{ inputs.device }}/msm8916-<正确板型>/' /boot/extlinux/extlinux.conf\`
          EOF

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: msm8916-debian-${{ inputs.device }}
          path: |
            msm8916-debian-${{ inputs.device }}.zip
            files/*
          if-no-files-found: warn
          retention-days: 30

      - name: 发布到 Releases
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: Debian ${{ inputs.suite }} for ${{ inputs.device }}
          files: msm8916-debian-${{ inputs.device }}.zip
          body: |
            板型 DTB：`msm8916-${{ inputs.device }}.dtb`
            Debian 版本：${{ inputs.suite }}
            额外预装：${{ inputs.extra_packages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧的工作流记录
        if: ${{ always() }}
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
